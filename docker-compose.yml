services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nutrilens
      POSTGRES_USER: nutrilens
      POSTGRES_PASSWORD: nutrilens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  gateway:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: gateway-service
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      AUTH_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
    depends_on:
      - redis
      - auth-service

  auth-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: auth-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/nutrilens
      DATABASE_USERNAME: nutrilens
      DATABASE_PASSWORD: nutrilens
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_ISSUER: http://auth-service:8080
    depends_on:
      - postgres
      - redis
      - kafka

  user-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    environment: &service-env
      DATABASE_URL: jdbc:postgresql://postgres:5432/nutrilens
      DATABASE_USERNAME: nutrilens
      DATABASE_PASSWORD: nutrilens
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - postgres
      - kafka

  nutrition-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: nutrition-service
    environment: *service-env
    depends_on:
      - postgres
      - redis
      - kafka

  analytics-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: analytics-service
    environment: *service-env
    depends_on:
      - postgres
      - redis
      - kafka

  recommendation-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: recommendation-service
    environment: *service-env
    depends_on:
      - postgres
      - redis
      - kafka

  leaderboard-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: leaderboard-service
    environment: *service-env
    depends_on:
      - postgres
      - redis
      - kafka

  achievement-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: achievement-service
    environment: *service-env
    depends_on:
      - postgres
      - redis
      - kafka

  notification-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    environment: *service-env
    depends_on:
      - postgres
      - kafka

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  grafana-data:

