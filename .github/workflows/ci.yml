name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build backend
        working-directory: services
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        module:
          - gateway-service
          - auth-service
          - user-service
          - nutrition-service
          - analytics-service
          - recommendation-service
          - leaderboard-service
          - achievement-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build ./services --build-arg MODULE=${{ matrix.module }} -t nutrilens/${{ matrix.module }}:${{ github.sha }}
